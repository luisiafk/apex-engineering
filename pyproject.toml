[project]
name = "apex"
version = "0.1.0"
description = "Autonomous Performance Engineering & Exploration"
readme = "README.md"
authors = [
    { name = "luisiafk", email = "luise.cohalla@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
apex-engineering = "apex:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]

science = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]

ml = [

    "scikit-learn>=1.9.1",
    "torch==2.6.0",
]

optimization = [
    "optuna>=5.0.0",
    "pymoo>=0.6.2",
]

dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true